name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...
      - run: go test -race ./...

      - name: test the llm module
        working-directory: llm
        run: go test -race ./...

  # The macOS keychain backend binds each stored secret to the binary that
  # stored it, which only happens in a cgo build. A CGO_ENABLED=0 darwin build
  # still compiles but silently falls back to a weaker path, so assert the cgo
  # build rather than letting a release degrade quietly.
  darwin-cgo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=1 go build ./...
      - run: CGO_ENABLED=1 go test ./internal/credentials/...

  # A broken .goreleaser.yml otherwise surfaces for the first time when a tag is
  # pushed, which is the worst moment to find out.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null .
