version: 2

project_name: dbmap

# Every artifact is a CGO_ENABLED=0 build, darwin included: the macOS keychain
# backend still calls the Security framework, but loads it at run time rather
# than linking it, so a darwin binary needs no C toolchain, no macOS SDK and no
# macOS machine. Linux and Windows fall back to the platform's own credential
# store, as they always have.
builds:
  - id: unix
    main: .
    binary: dbmap
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: macos
    main: .
    binary: dbmap
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

universal_binaries:
  - ids: [macos]
    replace: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: dbmap
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/dbmap
    description: Index a database into a compact map an agent can read in one pass
    # The binaries carry no Apple Developer ID, so strip the quarantine flag
    # Homebrew sets on cask downloads; Gatekeeper otherwise refuses to run them.
    custom_block: |
      postflight_steps do
        if_path_exists "/usr/bin/xattr" do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/dbmap"]
        end
      end

nfpms:
  - package_name: dbmap
    ids: [unix]
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/dbmap
    description: Index a database into a compact map an agent can read in one pass
    license: MIT
    bindir: /usr/bin

scoops:
  - name: dbmap
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/dbmap
    description: Index a database into a compact map an agent can read in one pass
    license: MIT

changelog:
  use: git
